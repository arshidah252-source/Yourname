<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Social App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
        body { background: #000; color: #fff; height: 100vh; display: flex; flex-direction: column; }
        .page { display: none; flex-direction: column; flex: 1; background: #111; overflow-y: auto; padding: 16px; }
        .page.active { display: flex; }
        .auth-box { max-width: 300px; margin: auto; width: 100%; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: #222; color: #fff; }
        .auth-box button { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: none; background: #ff0050; color: #fff; font-size: 16px; cursor: pointer; }
        .auth-box .switch { color: #888; text-align: center; cursor: pointer; margin-top: 10px; }
        .bottom-nav { display: flex; justify-content: space-around; align-items: center; background: #1a1a2e; padding: 10px 0; border-top: 1px solid #333; flex-shrink: 0; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; cursor: pointer; font-size: 12px; transition: 0.3s; padding: 4px 8px; }
        .nav-item .icon { font-size: 26px; line-height: 1; }
        .nav-item.active { color: #ff0050; }
        .add-btn .icon { background: #ff0050; color: white; padding: 6px 16px; border-radius: 50%; font-size: 30px; box-shadow: 0 4px 15px rgba(255,0,80,0.4); }
        .tabs { display: flex; gap: 20px; margin-bottom: 16px; border-bottom: 1px solid #333; padding-bottom: 8px; padding: 0 16px; }
        .tab { color: #888; cursor: pointer; font-size: 16px; padding: 4px 0; }
        .tab.active { color: #ff0050; border-bottom: 2px solid #ff0050; }
        .search-box { background: #222; padding: 8px 12px; border-radius: 20px; display: flex; align-items: center; gap: 8px; margin: 16px; }
        .search-box input { background: transparent; border: none; color: #fff; flex: 1; outline: none; }
        .search-box input::placeholder { color: #666; }
        .masonry { column-count: 2; column-gap: 8px; padding: 16px; }
        .masonry-item { break-inside: avoid; margin-bottom: 8px; background: #1a1a2e; border-radius: 12px; overflow: hidden; position: relative; cursor: pointer; }
        .masonry-item img { width: 100%; display: block; }
        .masonry-item video { width: 100%; display: block; }
        .masonry-item .icon-big { font-size: 48px; display: flex; justify-content: center; align-items: center; height: 200px; background: #222; color: #888; }
        .masonry-item .overlay { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.7)); padding: 8px; display: flex; justify-content: space-between; align-items: center; }
        .masonry-item .overlay .username { color: #fff; font-size: 12px; font-weight: bold; cursor: pointer; }
        .masonry-item .overlay .text { color: #ccc; font-size: 11px; }
        .masonry-actions { display: flex; justify-content: space-around; padding: 4px 0; background: #1a1a2e; flex-wrap: wrap; gap: 4px; }
        .masonry-actions button { background: none; border: none; color: #888; cursor: pointer; font-size: 12px; padding: 2px 4px; }
        .masonry-actions .liked { color: #ff0050; }
        .masonry-actions .saved { color: #ffb800; }
        .masonry-actions .delete-btn { color: #ff4444; }
        .masonry-actions .share-btn { color: #44aaff; }
        .masonry-actions .view-count { color: #666; font-size: 11px; }
        #addPost textarea { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #222; color: #fff; min-height: 100px; resize: vertical; }
        #addPost input[type="file"] { margin: 12px 0; color: #888; }
        #addPost .media-type { display: flex; gap: 12px; margin: 8px 0; }
        #addPost .media-type label { color: #888; cursor: pointer; }
        #addPost button { padding: 12px; border-radius: 8px; border: none; background: #ff0050; color: #fff; font-size: 16px; cursor: pointer; }
        .file-btn { background: #333; color: #fff; padding: 10px 16px; border-radius: 8px; border: none; cursor: pointer; margin: 8px 0; display: inline-block; }
        .file-btn:hover { background: #444; }
        .profile-header { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 20px; padding: 16px; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; overflow: hidden; }
        .profile-avatar img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .profile-stats { display: flex; gap: 24px; margin: 8px 0; }
        .profile-stats div { text-align: center; cursor: pointer; }
        .profile-stats .num { font-size: 18px; font-weight: bold; }
        .profile-stats .label { font-size: 12px; color: #888; }
        .follow-btn { background: #ff0050; color: #fff; border: none; padding: 8px 24px; border-radius: 20px; cursor: pointer; font-size: 14px; margin-top: 8px; }
        .follow-btn.following { background: #333; }
        .profile-tabs { display: flex; gap: 12px; margin: 12px 0; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .profile-tab { color: #888; cursor: pointer; padding: 4px 12px; font-size: 14px; }
        .profile-tab.active { color: #ff0050; border-bottom: 2px solid #ff0050; }
        .back-btn { background: #333; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-bottom: 16px; }
        .comments-overlay { position: fixed; bottom: 0; left: 0; right: 0; background: #1a1a2e; border-radius: 20px 20px 0 0; padding: 16px; max-height: 60vh; z-index: 1000; transform: translateY(100%); transition: transform 0.3s ease; overflow-y: auto; }
        .comments-overlay.open { transform: translateY(0); }
        .comments-overlay .handle { width: 40px; height: 4px; background: #444; border-radius: 2px; margin: 0 auto 12px; }
        .comments-overlay .close-btn { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; position: absolute; top: 12px; right: 16px; }
        .comments-overlay .comment-item { padding: 8px 0; border-bottom: 1px solid #222; }
        .comments-overlay .comment-header { display: flex; align-items: center; gap: 8px; }
        .comments-overlay .comment-avatar { width: 28px; height: 28px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; overflow: hidden; }
        .comments-overlay .comment-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .comments-overlay .comment-avatar.default { background: #ff0050; }
        .comments-overlay .comment-username { font-weight: bold; color: #ff0050; font-size: 13px; }
        .comments-overlay .comment-text { font-size: 14px; color: #ddd; margin: 4px 0 4px 36px; }
        .comments-overlay .comment-input-area { display: flex; gap: 8px; margin-top: 12px; position: sticky; bottom: 0; background: #1a1a2e; padding: 8px 0; }
        .comments-overlay .comment-input-area input { flex: 1; padding: 8px 12px; border-radius: 20px; border: none; background: #222; color: #fff; outline: none; }
        .comments-overlay .comment-input-area button { padding: 8px 16px; border-radius: 20px; border: none; background: #ff0050; color: #fff; cursor: pointer; }
        .video-slide { width: 100%; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #000; position: relative; }
        .video-slide video { width: 100%; height: 100%; object-fit: cover; }
        .video-slide .info { position: absolute; bottom: 150px; left: 16px; color: #fff; background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 20px; font-size: 14px; z-index: 10; }
        .video-slide .player-controls { position: absolute; bottom: 20px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 16px; z-index: 10; }
        .video-slide .player-controls .top-row { display: flex; justify-content: space-between; align-items: center; width: 100%; }
        .video-slide .player-controls .top-row button { background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 20px; padding: 8px 12px; border-radius: 8px; cursor: pointer; }
        .video-slide .player-controls .top-row .time { font-size: 12px; color: #fff; }
        .video-slide .player-controls .progress-bar { width: 100%; height: 4px; background: #333; border-radius: 2px; position: relative; cursor: pointer; }
        .video-slide .player-controls .progress-bar .progress-fill { width: 0%; height: 100%; background: #ff0050; border-radius: 2px; transition: width 0.1s; }
        .video-slide .actions-right { position: absolute; bottom: 180px; right: 16px; display: flex; flex-direction: column; gap: 16px; z-index: 10; }
        .video-slide .actions-right button { background: rgba(0,0,0,0.6); border: none; color: #fff; font-size: 20px; padding: 10px; border-radius: 50%; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .video-slide .actions-right .liked { color: #ff0050; }
        .video-slide .actions-right .saved { color: #ffb800; }
        .video-slide .actions-right .delete-btn { color: #ff4444; }
        .video-slide .actions-right .share-btn { color: #44aaff; }
        .video-slide .actions-right .view-count { color: #aaa; font-size: 14px; }
        #videoContainer::-webkit-scrollbar { display: none; }
        #videoContainer { -ms-overflow-style: none; scrollbar-width: none; }
        .video-header { position: absolute; top: 20px; left: 16px; display: flex; align-items: center; gap: 10px; z-index: 20; background: rgba(0,0,0,0.4); padding: 6px 12px 6px 6px; border-radius: 30px; cursor: pointer; }
        .video-header .video-avatar { width: 36px; height: 36px; border-radius: 50%; overflow: hidden; border: 2px solid #ff0050; }
        .video-header .video-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .video-header .video-avatar.default { background: #ff0050; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; }
        .video-header .video-username { color: #fff; font-weight: bold; font-size: 14px; text-shadow: 0 1px 3px rgba(0,0,0,0.5); }
        .chat-messages { flex: 1; overflow-y: auto; margin-bottom: 12px; padding: 16px; display: flex; flex-direction: column; }
        .chat-message { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 8px; margin-bottom: 4px; max-width: 80%; }
        .chat-message.me { background: #ff0050; align-self: flex-end; margin-left: auto; }
        .chat-message.other { background: #222; align-self: flex-start; }
        .chat-message .msg-avatar { width: 28px; height: 28px; border-radius: 50%; overflow: hidden; flex-shrink: 0; }
        .chat-message .msg-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .chat-message .msg-avatar.default { background: #ff0050; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #fff; }
        .chat-message .msg-text { flex: 1; }
        .chat-message .msg-text .msg-username { font-weight: bold; color: #ff0050; font-size: 12px; }
        .chat-message .msg-text .msg-content { font-size: 14px; word-break: break-word; }
        .chat-input { display: flex; gap: 8px; padding: 16px; }
        .chat-input input { flex: 1; padding: 10px; border-radius: 20px; border: none; background: #222; color: #fff; outline: none; }
        .chat-input button { padding: 10px 20px; border-radius: 20px; border: none; background: #ff0050; color: #fff; cursor: pointer; }
        .share-modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; }
        .share-modal.active { display: flex; }
        .share-modal-content { background: #1a1a2e; padding: 20px; border-radius: 16px; max-width: 300px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .share-modal-content h3 { color: #fff; margin-bottom: 12px; }
        .share-modal-content .user-item { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 8px; cursor: pointer; color: #fff; }
        .share-modal-content .user-item:hover { background: #333; }
        .share-modal-content .user-item .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 14px; overflow: hidden; }
        .share-modal-content .user-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .share-modal-content .close-modal { background: #ff0050; color: #fff; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; margin-top: 12px; width: 100%; }
        .settings-item { padding: 12px 16px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .settings-item:hover { background: #1a1a2e; }
        .settings-item .label { color: #fff; font-size: 14px; }
        .settings-item .value { color: #888; font-size: 13px; }
        .settings-item .arrow { color: #444; font-size: 18px; }
        .settings-input { background: #222; border: none; color: #fff; padding: 8px 12px; border-radius: 8px; width: 100%; margin: 4px 0; }
        .settings-btn { background: #ff0050; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; width: 100%; margin: 8px 0; }
        .settings-btn.danger { background: #ff4444; }
        .settings-btn.secondary { background: #333; }
        .settings-card { background: #1a1a2e; padding: 16px; border-radius: 12px; margin: 12px 16px; }
        .settings-card h4 { color: #fff; margin-bottom: 8px; }
        .theme-toggle { display: flex; gap: 12px; margin: 8px 0; }
        .theme-toggle button { flex: 1; padding: 10px; border-radius: 8px; border: none; cursor: pointer; background: #333; color: #fff; }
        .theme-toggle button.active { background: #ff0050; }
        .search-results { padding: 16px; }
        .search-result-item { padding: 8px 12px; border-bottom: 1px solid #222; cursor: pointer; display: flex; align-items: center; gap: 12px; }
        .search-result-item:hover { background: #1a1a2e; }
        .search-result-item .avatar { width: 32px; height: 32px; border-radius: 50%; background: #333; display: flex; align-items: center; justify-content: center; font-size: 14px; overflow: hidden; }
        .search-result-item .avatar img { width: 100%; height: 100%; object-fit: cover; }
        .search-result-item .name { color: #fff; }
        .search-result-item .type { color: #888; font-size: 12px; margin-left: auto; }
    </style>
</head>
<body>
    <!-- Auth -->
    <div id="auth" class="page active">
        <div class="auth-box">
            <h2 style="text-align:center; margin-bottom:20px;">Welcome</h2>
            <input type="text" id="username" placeholder="Username">
            <input type="password" id="password" placeholder="Password">
            <button id="loginBtn">Login</button>
            <button id="registerBtn" style="background:#333;">Register</button>
            <div class="switch" id="switchAuth">Don't have an account? Register</div>
        </div>
    </div>

    <!-- Home -->
    <div id="home" class="page">
        <div class="search-box"><span>🔍</span><input type="text" id="searchInput" placeholder="Search posts or users..."></div>
        <div class="tabs"><div class="tab active" data-tab="forYou">For You</div><div class="tab" data-tab="following">Following</div></div>
        <div class="masonry" id="postsContainer"></div>
    </div>

    <!-- Add Post -->
    <div id="addPost" class="page">
        <h2>Create Post</h2>
        <input type="text" id="postUsername" placeholder="Your username" style="padding:12px; border-radius:8px; border:none; background:#222; color:#fff; margin-bottom:12px;">
        <textarea id="postText" placeholder="What's on your mind? (Optional)"></textarea>
        <div class="media-type"><label><input type="radio" name="mediaType" value="image" checked> Image</label><label><input type="radio" name="mediaType" value="video"> Video</label></div>
        <button class="file-btn" onclick="document.getElementById('postMedia').click();">📁 Select from Gallery</button>
        <input type="file" id="postMedia" accept="image/*,video/*" style="display:none;">
        <button id="submitPost">Post</button>
    </div>

    <!-- Profile -->
    <div id="profile" class="page">
        <div class="profile-header">
            <div class="profile-avatar" id="profileAvatar">👤</div>
            <h2 id="profileName">User</h2>
            <div class="profile-stats">
                <div><div class="num" id="postCount">0</div><div class="label">Posts</div></div>
            </div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none;">
            <button id="logoutBtn" style="background:#333; color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; margin-top:8px;">Logout</button>
        </div>
        <div class="profile-tabs">
            <span class="profile-tab active" data-tab="myposts" onclick="switchProfileTab('myposts')">My Posts</span>
        </div>
        <div class="masonry" id="userPosts"></div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav" id="mainNav" style="display:none;">
        <div class="nav-item active" data-page="home"><span class="icon">🏠</span><span>Home</span></div>
        <div class="nav-item add-btn" data-page="addPost"><span class="icon">➕</span></div>
        <div class="nav-item" data-page="profile"><span class="icon">👤</span><span>Profile</span></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script>
        // Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBYUIcb24PfUNrJIoi5yhcVdtjoM6GRTBA",
            authDomain: "yourname-96b27.firebaseapp.com",
            projectId: "yourname-96b27",
            storageBucket: "yourname-96b27.firebasestorage.app",
            messagingSenderId: "508094145435",
            appId: "1:508094145435:web:9d2e851a856f23baa2f73e",
            measurementId: "G-5LJ15MBZNL"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // ===== DOM refs =====
        const authPage = document.getElementById('auth');
        const nav = document.getElementById('mainNav');
        const postsContainer = document.getElementById('postsContainer');
        const searchInput = document.getElementById('searchInput');
        const tabs = document.querySelectorAll('.tab');
        const userPostsDiv = document.getElementById('userPosts');
        const postCount = document.getElementById('postCount');

        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginBtn = document.getElementById('loginBtn');
        const registerBtn = document.getElementById('registerBtn');
        const switchAuth = document.getElementById('switchAuth');

        const submitPost = document.getElementById('submitPost');
        const postText = document.getElementById('postText');
        const postMedia = document.getElementById('postMedia');
        const postUsername = document.getElementById('postUsername');

        const profileAvatar = document.getElementById('profileAvatar');
        const profileName = document.getElementById('profileName');
        const avatarInput = document.getElementById('avatarInput');
        const logoutBtn = document.getElementById('logoutBtn');

        let currentUser = localStorage.getItem('currentUser') || null;
        let currentTab = 'forYou';
        let profileTab = 'myposts';
        let isLogin = true;

        // ===== AUTH =====
        function updateUI() {
            if (currentUser) {
                authPage.classList.remove('active');
                nav.style.display = 'flex';
                showPage('home');
                renderPosts();
                profileName.textContent = currentUser;
                renderUserPosts();
            } else {
                authPage.classList.add('active');
                nav.style.display = 'none';
            }
        }

        function switchMode() {
            isLogin = !isLogin;
            loginBtn.style.display = isLogin ? 'block' : 'none';
            registerBtn.style.display = isLogin ? 'none' : 'block';
            switchAuth.textContent = isLogin ? "Don't have an account? Register" : "Already have an account? Login";
        }
        switchAuth.addEventListener('click', switchMode);

        loginBtn.addEventListener('click', () => {
            const u = usernameInput.value.trim();
            const p = passwordInput.value.trim();
            // Simple auth: just check if user exists in localStorage
            const users = JSON.parse(localStorage.getItem('users')) || {};
            if (users[u] && users[u].password === p) {
                currentUser = u;
                localStorage.setItem('currentUser', u);
                updateUI();
            } else {
                alert('Invalid username or password');
            }
        });

        registerBtn.addEventListener('click', () => {
            const u = usernameInput.value.trim();
            const p = passwordInput.value.trim();
            if (!u || !p) return alert('Fill all fields');
            const users = JSON.parse(localStorage.getItem('users')) || {};
            if (users[u]) return alert('User already exists');
            users[u] = { password: p };
            localStorage.setItem('users', JSON.stringify(users));
            currentUser = u;
            localStorage.setItem('currentUser', u);
            updateUI();
        });

        logoutBtn.addEventListener('click', () => {
            currentUser = null;
            localStorage.removeItem('currentUser');
            updateUI();
        });

        // ===== NAVIGATION =====
        function showPage(id) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.querySelector(`.nav-item[data-page="${id}"]`)?.classList.add('active');
            if (id === 'home') renderPosts();
            if (id === 'profile') renderUserPosts();
        }

        document.querySelectorAll('.nav-item[data-page]').forEach(item => {
            item.addEventListener('click', () => {
                const id = item.dataset.page;
                if (id === 'addPost' && !currentUser) return alert('Please login first');
                showPage(id);
            });
        });

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                currentTab = tab.dataset.tab;
                renderPosts();
            });
        });

        searchInput.addEventListener('input', renderPosts);

        function switchProfileTab(tab) {
            profileTab = tab;
            document.querySelectorAll('.profile-tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.profile-tab[data-tab="${tab}"]`)?.classList.add('active');
            renderUserPosts();
        }

        // ===== POSTS (Firebase) =====
        function renderPosts() {
            const query = searchInput.value.toLowerCase();
            const postsRef = database.ref('posts');
            postsRef.orderByChild('timestamp').on('child_added', function(snapshot) {
                const p = snapshot.val();
                const postId = snapshot.key;
                // Check if post already exists in DOM to avoid duplicates
                if (document.querySelector(`[data-post-id="${postId}"]`)) return;
                
                const div = document.createElement('div');
                div.className = 'masonry-item';
                div.dataset.postId = postId;
                let mediaHTML = '';
                if (p.mediaType === 'image' && p.media) {
                    mediaHTML = `<img src="${p.media}">`;
                } else if (p.mediaType === 'video' && p.media) {
                    mediaHTML = `<video src="${p.media}" muted></video>`;
                } else {
                    mediaHTML = `<div class="icon-big">📝</div>`;
                }
                const isOwner = p.username === currentUser;
                div.innerHTML = `
                    ${mediaHTML}
                    <div class="overlay">
                        <span class="username">${p.username}</span>
                        <span class="text">${p.text || ''}</span>
                    </div>
                    <div class="masonry-actions">
                        <span class="view-count">👁️ ${p.views || 0}</span>
                        ${isOwner ? `<button class="delete-btn" onclick="deletePost('${postId}')">🗑️</button>` : ''}
                    </div>
                `;
                postsContainer.appendChild(div);
            });
        }

        function deletePost(postId) {
            if (!confirm('Are you sure you want to delete this post?')) return;
            database.ref('posts/' + postId).remove().then(() => {
                // Remove from DOM
                const el = document.querySelector(`[data-post-id="${postId}"]`);
                if (el) el.remove();
                renderUserPosts();
            });
        }

        submitPost.addEventListener('click', () => {
            const text = postText.value.trim();
            const username = postUsername.value.trim() || currentUser || 'Anonymous';
            if (!text) return alert('Write something');

            const file = postMedia.files[0];
            if (file) {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => {
                    const mediaType = file.type.startsWith('video/') ? 'video' : 'image';
                    const newPost = {
                        username: username,
                        text: text,
                        media: reader.result,
                        mediaType: mediaType,
                        views: 0,
                        timestamp: Date.now()
                    };
                    database.ref('posts').push(newPost).then(() => {
                        postText.value = '';
                        postMedia.value = '';
                        showPage('home');
                    });
                };
            } else {
                const newPost = {
                    username: username,
                    text: text,
                    media: null,
                    mediaType: 'text',
                    views: 0,
                    timestamp: Date.now()
                };
                database.ref('posts').push(newPost).then(() => {
                    postText.value = '';
                    showPage('home');
                });
            }
        });

        // ===== USER POSTS =====
        function renderUserPosts() {
            userPostsDiv.innerHTML = '';
            let count = 0;
            const postsRef = database.ref('posts');
            postsRef.orderByChild('timestamp').on('child_added', function(snapshot) {
                const p = snapshot.val();
                if (p.username === currentUser) {
                    count++;
                    const div = document.createElement('div');
                    div.className = 'masonry-item';
                    let mediaHTML = '';
                    if (p.mediaType === 'image' && p.media) {
                        mediaHTML = `<img src="${p.media}">`;
                    } else if (p.mediaType === 'video' && p.media) {
                        mediaHTML = `<video src="${p.media}" muted></video>`;
                    } else {
                        mediaHTML = `<div class="icon-big">📝</div>`;
                    }
                    div.innerHTML = `
                        ${mediaHTML}
                        <div class="overlay">
                            <span class="username">${p.username}</span>
                            <span class="text">${p.text || ''}</span>
                        </div>
                    `;
                    userPostsDiv.appendChild(div);
                }
            });
            postCount.textContent = count;
        }

        // ===== AVATAR =====
        profileAvatar.addEventListener('click', () => avatarInput.click());
        avatarInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => {
                const users = JSON.parse(localStorage.getItem('users')) || {};
                if (!users[currentUser]) users[currentUser] = {};
                users[currentUser].avatar = reader.result;
                localStorage.setItem('users', JSON.stringify(users));
                profileAvatar.innerHTML = `<img src="${reader.result}">`;
            };
        });

        // ===== INIT =====
        // Load avatar if exists
        const users = JSON.parse(localStorage.getItem('users')) || {};
        if (currentUser && users[currentUser] && users[currentUser].avatar) {
            profileAvatar.innerHTML = `<img src="${users[currentUser].avatar}">`;
        }

        switchMode();
        updateUI();
    </script>
</body>
    </html>
